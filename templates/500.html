<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - ToxiGuard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-box {
            background: white;
            padding: 45px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            max-width: 500px;
        }

        h1 {
            font-size: 70px;
            margin: 0;
            color: #dc2626;
        }

        h2 {
            margin: 10px 0;
            color: #222;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="error-box">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong while processing your request.</p>
        <a href="/">Go to Home</a>
    </div>

</body>
</html>
