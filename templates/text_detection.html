<!DOCTYPE html>
<html>
<head>

    <title>Hate Speech Toxicity Detector - Text Detection</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 230px;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .nav a {
            display: block;
            padding: 13px;
            margin: 7px 0;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 8px;
        }

        .nav a:hover {
            background: #1f2937;
            color: white;
        }

        .main {
            margin-left: 260px;
            padding: 35px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            max-width: 850px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f9fafb;
        }

        .toxic {
            color: #dc2626;
        }

        .safe {
            color: #16a34a;
        }

    </style>

</head>

<body>


<aside class="sidebar">

    <div class="brand">
        🛡️ Hate Speech Toxicity Detector
    </div>

    <nav class="nav">

        <a href="{{ url_for('dashboard') }}">
            📊 Dashboard
        </a>

        <a href="{{ url_for('youtube_page') }}">
            ▶️ YouTube Analysis
        </a>

        <a href="{{ url_for('comments_page') }}">
            💬 All Comments
        </a>

        <a href="{{ url_for('text_detection_page') }}">
            📝 Single Text Detection
        </a>

        <a href="{{ url_for('categories_page') }}">
            🧠 Categories
        </a>

        <a href="{{ url_for('logout') }}">
            🚪 Logout
        </a>

    </nav>

</aside>


<main class="main">

    <h1>📝 Single Text Detection</h1>

    <p>
        Enter any text to analyze it using the
        trained DistilBERT model.
    </p>


    <div class="box">

        <textarea
            id="textInput"
            placeholder="Enter a comment or text here..."
        ></textarea>


        <button onclick="predictText()">
            🔍 Detect Toxicity
        </button>


        <div
            id="result"
            class="result"
            style="display:none"
        >

            <h2 id="prediction"></h2>

            <p>
                <strong>Confidence:</strong>
                <span id="confidence"></span>%
            </p>

            <p>
                <strong>Toxic Score:</strong>
                <span id="toxicScore"></span>%
            </p>

            <p>
                <strong>Detected Categories:</strong>
                <span id="categories"></span>
            </p>

        </div>

    </div>

</main>


<script>

async function predictText() {

    const text =
        document
        .getElementById("textInput")
        .value
        .trim();


    if (!text) {

        alert(
            "Please enter some text."
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/predict",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Prediction failed."
            );

        }


        const result =
            document.getElementById(
                "result"
            );


        result.style.display =
            "block";


        const prediction =
            document.getElementById(
                "prediction"
            );


        prediction.textContent =
            data.prediction;


        prediction.className =
            data.prediction === "Toxic"
                ? "toxic"
                : "safe";


        document
            .getElementById("confidence")
            .textContent =
            Number(
                data.confidence
            ).toFixed(2);


        document
            .getElementById("toxicScore")
            .textContent =
            Number(
                data.toxic_score
            ).toFixed(2);


        document
            .getElementById("categories")
            .textContent =
            data.categories.length > 0
                ? data.categories.join(", ")
                : "None";

    }

    catch (error) {

        alert(
            "Prediction error: " +
            error.message
        );

    }

}

</script>

</body>
</html>
